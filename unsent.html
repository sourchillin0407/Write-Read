<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read — 보내지 않은 편지</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #eef2c8;
      --text: #2c2c2c;
      --point: #6b7c3a;
      --paper-warm: #f7ece2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 72px 24px 110px;
    }

    .wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: clamp(18px, 3.6vw, 24px); text-align: center; }
    .sub { font-size: 14px; text-align: center; margin-top: 16px; color: rgba(44, 44, 44, 0.55); }

    .new {
      margin-top: 40px;
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .new:hover { opacity: 0.85; }

    /* 쓰기 모드 */
    #write-box { display: none; width: 100%; flex-direction: column; align-items: center; margin-top: 40px; }
    #write-box.on { display: flex; animation: fade 0.6s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .memo {
      width: 100%;
      background: transparent;
      border: none;
      resize: none;
      overflow: hidden;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: inherit;
      color: var(--text);
      caret-color: var(--text);
      outline: none;
      min-height: 4.5em;
    }

    /* 내 서랍 — 편지 카드 */
    .drawer { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-top: 48px; }

    .letter {
      background: var(--paper-warm);
      border-radius: 4px;
      padding: 26px 26px 18px;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.08);
    }
    .letter:nth-child(odd)  { transform: rotate(-0.5deg); }
    .letter:nth-child(even) { transform: rotate(0.4deg); }

    .letter .body { font-size: 15px; line-height: 1.5; white-space: pre-line; }
    .letter .date { font-size: 12px; margin-top: 14px; color: rgba(44, 44, 44, 0.45); }

    .letter .tools { display: flex; gap: 20px; margin-top: 12px; }
    .tool {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.5);
      cursor: pointer;
      padding: 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .tool:hover { color: var(--text); border-bottom-color: var(--text); }

    /* 지도 */
    .map-title { font-size: 15px; margin-top: 64px; text-align: center; }
    .map-sub { font-size: 13px; margin-top: 8px; text-align: center; color: rgba(44, 44, 44, 0.55); }

    #map {
      width: 100%;
      height: 340px;
      margin-top: 24px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.1);
    }
    #map.placing { cursor: crosshair; }

    .placing-note {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      margin-top: 16px;
      color: var(--point);
      text-align: center;
    }
    .placing-note.on { display: flex; }

    .place-input {
      width: 100%;
      max-width: 320px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: inherit;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .place-input::placeholder { color: rgba(44, 44, 44, 0.35); }
    .place-input:focus { border-bottom-color: var(--text); }

    #place-results { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .place-option {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: var(--text);
      cursor: pointer;
      padding: 2px 4px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    .place-option:hover { border-bottom-color: var(--text); }

    .tool.here { color: var(--point); font-size: 13px; }
    .tool.here:hover { color: var(--point); border-bottom-color: var(--point); }

    .tool.goto-me { margin-top: 14px; font-size: 13px; }

    .leaflet-popup-content { font-family: 'Pretendard', 'Noto Sans', sans-serif; letter-spacing: 0.03em; line-height: 1.5; }

    /* 하단 독 */
    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      z-index: 1000;
    }
    .dock a { color: var(--point); opacity: 0.8; transition: opacity 0.2s ease; display: flex; }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">보내지 않은 편지</p>
    <p class="sub">부치지 않아도, 편지는 편지니까요.<br/>여기 적어두고 — 공개할지는 당신이 정해요.</p>

    <button class="new" id="new-letter">새로 적기</button>

    <!-- 쓰기 모드 -->
    <div id="write-box">
      <textarea class="memo" id="memo" rows="3" placeholder="" autocomplete="off" spellcheck="false"></textarea>
      <button class="new" id="keep">서랍에 담아두기</button>
    </div>

    <!-- 내가 적어둔 편지들 -->
    <div class="drawer" id="drawer"></div>

    <!-- 떠도는 편지들의 지도 -->
    <p class="map-title">떠도는 편지들</p>
    <p class="map-sub">공개된 편지는, 그 편지가 놓인 자리에서 누구나 주울 수 있어요.</p>
    <div class="placing-note" id="placing-note">
      <span id="placing-msg">이 편지를 둘 곳의 주소나 장소 이름을 적어주세요.</span>
      <input class="place-input" id="place-input" type="text"
        placeholder="예: 서울 성수동, Shibuya, Montmartre" autocomplete="off" />
      <button class="tool here" id="place-search">자리 찾기</button>
      <div id="place-results"></div>
      <button class="tool here" id="place-here">아니면 — 지금 내가 있는 자리에 두기</button>
    </div>
    <div id="map"></div>
    <button class="tool goto-me" id="goto-me">내가 있는 곳으로</button>
  </div>

  <!-- 하단 독: 오늘의 질문 / 받은 편지함 / 프로필 -->
  <nav class="dock">
    <a href="question.html" aria-label="오늘의 질문">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 L12 20 M4 12 L20 12"/>
      </svg>
    </a>
    <a href="inbox.html" aria-label="받은 편지함">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
    </a>
    <a href="profile.html" aria-label="프로필">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/>
        <path d="M5 19.5 C6.5 15.5 9 14.5 12 14.5 C15 14.5 17.5 15.5 19 19.5"/>
      </svg>
    </a>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── 보내지 않은 편지: 지금은 내 브라우저(localStorage)에만 저장돼요.
    //    나중에 Supabase가 붙으면 공개 편지를 전세계가 함께 보게 됩니다.

    var letters = JSON.parse(localStorage.getItem('wr_unsent') || '[]');
    function persist() { localStorage.setItem('wr_unsent', JSON.stringify(letters)); }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── 지도 (밝고 차분한 타일 — 사이트 톤에 맞춰서)
    var map = L.map('map', { worldCopyJump: true }).setView([24, 10], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    // 다른 사람들의 공개 편지는 아직 연결되지 않았어요.
    // Supabase가 붙으면, 전세계의 공개 편지가 여기에 함께 표시됩니다.

    var markers = [];
    function drawMarkers() {
      markers.forEach(function (m) { map.removeLayer(m); });
      markers = [];
      letters.forEach(function (l) {
        if (l.public && l.spot) {
          var m = L.circleMarker(l.spot, {
            radius: 7, color: '#6b7c3a', weight: 1.5,
            fillColor: '#f7ece2', fillOpacity: 0.95
          }).addTo(map).bindPopup(escapeHtml(l.text) + '<br/><small>— 나의 편지</small>');
          markers.push(m);
        }
      });
    }

    // ── 내 서랍 그리기
    function drawDrawer() {
      var drawer = document.getElementById('drawer');
      drawer.innerHTML = '';
      letters.forEach(function (l, i) {
        var card = document.createElement('div');
        card.className = 'letter';
        var whereLabel = l.public
          ? (l.place ? ' · ' + escapeHtml(l.place) + '에 두었어요' : ' · 지도 위에 있어요')
          : ' · 서랍 속에 있어요';
        card.innerHTML =
          '<p class="body">' + escapeHtml(l.text) + '</p>' +
          '<p class="date">' + l.date + whereLabel + '</p>';

        var tools = document.createElement('div');
        tools.className = 'tools';

        var pub = document.createElement('button');
        pub.className = 'tool';
        pub.textContent = l.public ? '거두기' : '지도에 두기';
        pub.addEventListener('click', function () {
          if (l.public) {
            l.public = false; l.spot = null;
            persist(); drawDrawer(); drawMarkers();
          } else {
            startPlacing(i);
          }
        });

        var del = document.createElement('button');
        del.className = 'tool';
        del.textContent = '지우기';
        del.addEventListener('click', function () {
          letters.splice(i, 1);
          persist(); drawDrawer(); drawMarkers();
        });

        tools.appendChild(pub);
        tools.appendChild(del);
        card.appendChild(tools);
        drawer.appendChild(card);
      });
    }

    // ── 지도에 두기: 주소를 적어서 자리를 정합니다
    var placingIndex = null;
    function startPlacing(i) {
      placingIndex = i;
      document.getElementById('placing-msg').textContent = '이 편지를 둘 곳의 주소나 장소 이름을 적어주세요.';
      document.getElementById('place-input').value = '';
      document.getElementById('placing-note').classList.add('on');
      document.getElementById('placing-note').scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('place-input').focus();
    }

    function placeAt(spot, placeName) {
      if (placingIndex === null) return;
      letters[placingIndex].public = true;
      letters[placingIndex].spot = spot;
      letters[placingIndex].place = placeName || '';
      placingIndex = null;
      document.getElementById('placing-note').classList.remove('on');
      map.setView(spot, 13);
      persist(); drawDrawer(); drawMarkers();
    }

    // ── 주소 → 후보 자리들 (무료 주소 검색 두 곳을 차례로 — Photon이 한국어에 강해요)
    function geocode(query, ok, fail) {
      fetch('https://photon.komoot.io/api/?limit=4&q=' + encodeURIComponent(query))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.features && j.features.length) {
            ok(j.features.map(function (f) {
              var p = f.properties;
              var label = [p.name, p.city || p.county, p.state, p.country]
                .filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ');
              return { spot: [f.geometry.coordinates[1], f.geometry.coordinates[0]], label: label };
            }));
          } else {
            // 못 찾으면 Nominatim으로 한 번 더
            return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=4&q=' + encodeURIComponent(query))
              .then(function (r) { return r.json(); })
              .then(function (list) {
                if (list && list.length) {
                  ok(list.map(function (item) {
                    return { spot: [parseFloat(item.lat), parseFloat(item.lon)], label: item.display_name };
                  }));
                } else fail();
              });
          }
        })
        .catch(fail);
    }

    function searchAndPlace() {
      var q = document.getElementById('place-input').value.trim();
      if (!q) return;
      var msg = document.getElementById('placing-msg');
      var results = document.getElementById('place-results');
      msg.textContent = '자리를 찾고 있어요…';
      results.innerHTML = '';
      geocode(q, function (options) {
        msg.textContent = options.length > 1 ? '여기인가요?' : '여기인가요? 맞다면 눌러주세요.';
        options.forEach(function (o) {
          var b = document.createElement('button');
          b.className = 'place-option';
          b.textContent = o.label;
          b.addEventListener('click', function () {
            results.innerHTML = '';
            placeAt(o.spot, o.label);
          });
          results.appendChild(b);
        });
      }, function () {
        msg.textContent = '그곳을 찾지 못했어요. 조금 다르게 적어볼까요?';
      });
    }

    document.getElementById('place-search').addEventListener('click', searchAndPlace);
    document.getElementById('place-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); searchAndPlace(); }
    });

    // ── GPS: 브라우저에 위치 권한을 물어봅니다
    function locate(ok, fail) {
      if (!navigator.geolocation) { fail(); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) { ok([pos.coords.latitude, pos.coords.longitude]); },
        function () { fail(); },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // "지금 내가 있는 자리에 두기"
    document.getElementById('place-here').addEventListener('click', function () {
      locate(function (spot) {
        placeAt(spot, '');
      }, function () {
        document.getElementById('placing-msg').textContent =
          '위치를 가져올 수 없었어요. 주소를 적어서 자리를 정해주세요.';
      });
    });

    // "내가 있는 곳으로" — 지도만 내 위치로 이동
    document.getElementById('goto-me').addEventListener('click', function () {
      locate(function (spot) {
        map.setView(spot, 12);
      }, function () {
        alert('위치를 가져올 수 없었어요. 브라우저의 위치 권한을 확인해주세요.');
      });
    });

    // ── 새로 적기 / 담아두기
    var memo = document.getElementById('memo');
    memo.addEventListener('input', function () {
      memo.style.height = 'auto';
      memo.style.height = memo.scrollHeight + 'px';
    });

    document.getElementById('new-letter').addEventListener('click', function () {
      document.getElementById('write-box').classList.add('on');
      memo.focus();
    });

    document.getElementById('keep').addEventListener('click', function () {
      if (!memo.value.trim()) return;
      var now = new Date();
      letters.unshift({
        text: memo.value.trim(),
        date: now.getFullYear() + '.' + (now.getMonth() + 1) + '.' + now.getDate(),
        public: false,
        spot: null
      });
      memo.value = '';
      document.getElementById('write-box').classList.remove('on');
      persist(); drawDrawer(); drawMarkers();
    });

    drawDrawer();
    drawMarkers();
  </script>
</body>
</html>
