<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read — 보내지 않은 편지</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;
      --text: #2c2c2c;
      --point: #6b7c3a;
      --paper-warm: #f7ece2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 72px 24px 110px;
    }

    .wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: clamp(18px, 3.6vw, 24px); text-align: center; }
    .sub { font-size: 14px; text-align: center; margin-top: 16px; color: rgba(44, 44, 44, 0.55); }

    .new {
      margin-top: 40px;
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .new:hover { opacity: 0.85; }

    /* 쓰기 모드 */
    #write-box { display: none; width: 100%; flex-direction: column; align-items: center; margin-top: 40px; }
    #write-box.on { display: flex; animation: fade 0.6s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .memo {
      width: 100%;
      background: transparent;
      border: none;
      resize: none;
      overflow: hidden;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: inherit;
      color: var(--text);
      caret-color: var(--text);
      outline: none;
      min-height: 4.5em;
    }

    /* 내 서랍 — 편지 카드 */
    .drawer { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-top: 48px; }

    .letter {
      background: var(--paper-warm);
      border-radius: 4px;
      padding: 26px 26px 18px;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.08);
    }
    .letter:nth-child(odd)  { transform: rotate(-0.5deg); }
    .letter:nth-child(even) { transform: rotate(0.4deg); }

    .letter .body { font-size: 15px; line-height: 1.5; white-space: pre-line; }
    .letter .date { font-size: 12px; margin-top: 14px; color: rgba(44, 44, 44, 0.45); }

    .letter .tools { display: flex; gap: 20px; margin-top: 12px; }
    .tool {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.5);
      cursor: pointer;
      padding: 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .tool:hover { color: var(--text); border-bottom-color: var(--text); }

    /* 하단 독 */
    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      z-index: 1000;
    }
    .dock a { color: var(--point); opacity: 0.8; transition: opacity 0.2s ease; display: flex; }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title" data-i18n="unsent.title"></p>
    <p class="sub" data-i18n="unsent.sub"></p>

    <button class="new" id="new-letter" data-i18n="unsent.new"></button>

    <!-- 쓰기 모드 -->
    <div id="write-box">
      <textarea class="memo" id="memo" rows="3" placeholder="" autocomplete="off" spellcheck="false"></textarea>
      <button class="new" id="keep" data-i18n="unsent.keep"></button>
    </div>

    <!-- 내가 적어둔 편지들 -->
    <div class="drawer" id="drawer"></div>
  </div>

  <!-- 하단 독: 오늘의 질문 / 받은 편지함 / 지도 / 프로필 -->
  <nav class="dock">
    <a href="question.html" data-i18n-aria="nav.question" aria-label="오늘의 질문">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 L12 20 M4 12 L20 12"/>
      </svg>
    </a>
    <a href="inbox.html" data-i18n-aria="nav.inbox" aria-label="받은 편지함">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
    </a>
    <a href="map.html" data-i18n-aria="nav.map" aria-label="지도">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12 L21 12"/>
        <path d="M12 3 C16.5 3 16.5 21 12 21 C7.5 21 7.5 3 12 3 Z"/>
      </svg>
    </a>
    <a href="profile.html" data-i18n-aria="nav.profile" aria-label="프로필">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/>
        <path d="M5 19.5 C6.5 15.5 9 14.5 12 14.5 C15 14.5 17.5 15.5 19 19.5"/>
      </svg>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="i18n.js"></script>
  <script>
    // ── 보내지 않은 편지: 글은 내 브라우저(서랍)에 보관돼요.
    //    '지도에 공개하기'를 누르면 Supabase에 올라가 전 세계가 3일간 함께 봐요.

    requireLogin(); // 지도 공개에는 로그인이 필요해요

    var letters = JSON.parse(localStorage.getItem('wr_unsent') || '[]');
    function persist() { localStorage.setItem('wr_unsent', JSON.stringify(letters)); }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = (s == null) ? '' : s;
      return d.innerHTML;
    }

    var DAY = 24 * 3600 * 1000;
    // 공개가 유효하면 남은 일수(1~3), 만료/비공개면 0
    function daysLeft(l) {
      if (!l.published || !l.publishedAt) return 0;
      var left = Math.ceil((l.publishedAt + 3 * DAY - Date.now()) / DAY);
      return left > 0 ? left : 0;
    }

    function unplace(l) {
      if (l.wallId) {
        apiFetch('/api/unplace', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: l.wallId })
        });
      }
    }

    // ── 내 서랍 그리기
    function drawDrawer() {
      var drawer = document.getElementById('drawer');
      drawer.innerHTML = '';
      letters.forEach(function (l, i) {
        var live = daysLeft(l);                    // >0 이면 지금 지도에 살아있음
        var expired = l.published && live === 0;   // 공개했는데 3일 지남

        var card = document.createElement('div');
        card.className = 'letter';

        var label = (live > 0) ? t('unsent.published', { days: live })
                  : expired   ? t('unsent.expired')
                  :             t('unsent.inDrawer');

        card.innerHTML =
          '<p class="body">' + escapeHtml(l.text) + '</p>' +
          '<p class="date">' + escapeHtml(l.date) + ' · ' + label + '</p>';

        var tools = document.createElement('div');
        tools.className = 'tools';

        var pub = document.createElement('button');
        pub.className = 'tool';
        pub.textContent = (live > 0) ? t('unsent.collect') : t('unsent.placeOnMap');
        pub.addEventListener('click', function () {
          if (live > 0) {
            // 거두기 — 서버에서 지우고 서랍으로
            unplace(l);
            l.published = false; l.publishedAt = null; l.wallId = null;
            persist(); drawDrawer();
          } else {
            // 자리 정하기는 지도에서 — 어떤 편지인지(번호+내용) 넘겨주고 이동
            localStorage.setItem('wr_placing', JSON.stringify({ idx: i, text: l.text }));
            window.location.href = 'map.html';
          }
        });

        var del = document.createElement('button');
        del.className = 'tool';
        del.textContent = t('unsent.delete');
        del.addEventListener('click', function () {
          if (live > 0) unplace(l); // 지도에 떠있으면 같이 거둬요
          letters.splice(i, 1);
          persist(); drawDrawer();
        });

        tools.appendChild(pub);
        tools.appendChild(del);
        card.appendChild(tools);
        drawer.appendChild(card);
      });
    }

    // ── 새로 적기 / 담아두기
    var memo = document.getElementById('memo');
    memo.addEventListener('input', function () {
      memo.style.height = 'auto';
      memo.style.height = memo.scrollHeight + 'px';
    });

    document.getElementById('new-letter').addEventListener('click', function () {
      document.getElementById('write-box').classList.add('on');
      memo.focus();
    });

    document.getElementById('keep').addEventListener('click', function () {
      if (!memo.value.trim()) return;
      var now = new Date();
      letters.unshift({
        text: memo.value.trim(),
        date: now.getFullYear() + '.' + (now.getMonth() + 1) + '.' + now.getDate(),
        published: false
      });
      memo.value = '';
      document.getElementById('write-box').classList.remove('on');
      persist(); drawDrawer();
    });

    drawDrawer();

    // 언어가 바뀌면 서랍의 글자(상태·버튼)도 다시 그려요
    document.addEventListener('i18n:changed', drawDrawer);
  </script>
</body>
</html>
