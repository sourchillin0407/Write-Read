<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read — 받은 편지함</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;
      --text: #2c2c2c;
      --point: #6b7c3a;
      --paper-warm: #f7ece2;
      --paper-cool: #e2ece4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 24px 110px;
    }

    .view { display: none; width: 100%; max-width: 640px; }
    .view.on { display: flex; flex-direction: column; align-items: center; animation: fade 0.6s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .lead { font-size: clamp(16px, 3vw, 20px); text-align: center; margin-bottom: 40px; }
    .sub { font-size: 14px; text-align: center; margin-top: 20px; color: rgba(44, 44, 44, 0.55); }

    /* 편지지 카드 */
    .letters { display: flex; flex-direction: column; gap: 20px; width: 100%; }

    .letter {
      background: var(--paper);
      border: none;
      border-radius: 4px;
      padding: 28px 28px 22px;
      font-family: inherit;
      letter-spacing: inherit;
      color: var(--text);
      text-align: left;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.08);
    }
    .letter:nth-child(odd)  { transform: rotate(-0.6deg); }
    .letter:nth-child(even) { transform: rotate(0.5deg); }

    .letter .original { font-size: 16px; line-height: 1.5; white-space: pre-line; }
    .letter .translated { font-size: 13px; line-height: 1.5; margin-top: 12px; color: rgba(44, 44, 44, 0.6); white-space: pre-line; }
    .letter .from { font-size: 12px; margin-top: 16px; color: rgba(44, 44, 44, 0.45); }

    /* 답장 토글 */
    .reply-toggle {
      margin-top: 16px;
      background: none;
      border: none;
      border-top: none; border-left: none; border-right: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.45);
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .reply-toggle:hover { color: var(--text); border-bottom-color: var(--text); }

    .reply-form { display: none; flex-direction: column; gap: 12px; margin-top: 18px; }
    .reply-form.on { display: flex; animation: fade 0.4s ease; }

    .reply-text {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      resize: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: inherit;
      color: var(--text);
      caret-color: var(--text);
      outline: none;
      padding: 4px 2px 8px;
      transition: border-color 0.2s ease;
    }
    .reply-text::placeholder { color: rgba(44, 44, 44, 0.4); }
    .reply-text:focus { border-bottom-color: var(--text); }

    .reply-send {
      align-self: flex-start;
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 8px 24px;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .reply-send:hover { opacity: 0.85; }

    .reply-note { font-size: 12px; color: rgba(44, 44, 44, 0.45); }

    /* 하단 독 */
    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
    }
    .dock a { color: var(--point); opacity: 0.8; transition: opacity 0.2s ease; display: flex; }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- ① 편지 목록 (아직 도착한 편지가 없을 때) -->
  <section class="view on" id="view-empty">
    <p class="lead">아직, 도착한 편지가 없어요.</p>
    <p class="sub">누군가에게 답이 닿으면, 여기로 편지가 와요.</p>
  </section>

  <!-- ② 편지 목록 (도착한 편지가 있을 때) -->
  <section class="view" id="view-list">
    <p class="lead">도착한 편지들이에요.</p>
    <div class="letters" id="letters"></div>
  </section>

  <!-- 하단 독: 오늘의 질문 / 보내지 않은 편지 / 지도 / 프로필 -->
  <nav class="dock">
    <a href="question.html" aria-label="오늘의 질문">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 L12 20 M4 12 L20 12"/>
      </svg>
    </a>
    <a href="unsent.html" aria-label="보내지 않은 편지">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3 a2.828 2.828 0 1 1 4 4 L7.5 20.5 L2 22 l1.5 -5.5 L17 3 z"/>
      </svg>
    </a>
    <a href="map.html" aria-label="지도">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12 L21 12"/>
        <path d="M12 3 C16.5 3 16.5 21 12 21 C7.5 21 7.5 3 12 3 Z"/>
      </svg>
    </a>
    <a href="profile.html" aria-label="프로필">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/>
        <path d="M5 19.5 C6.5 15.5 9 14.5 12 14.5 C15 14.5 17.5 15.5 19 19.5"/>
      </svg>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    function show(id) {
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('on'); });
      document.getElementById(id).classList.add('on');
    }

    // 로그인 확인 후, 내 받은 편지함만 불러와요 (출입증 자동 첨부)
    requireLogin().then(function (token) {
      if (!token) return;
      loadInbox();
    });

    function loadInbox() {
    apiFetch('/api/inbox')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var messages = (data && data.messages) || [];
        if (!messages.length) { show('view-empty'); return; }

        var box = document.getElementById('letters');
        box.innerHTML = '';
        messages.forEach(function (m, idx) {
          var card = document.createElement('div');
          card.className = 'letter';
          card.style.setProperty('--paper', idx % 2 === 0 ? 'var(--paper-warm)' : 'var(--paper-cool)');
          card.innerHTML =
            '<p class="original"></p>' +
            '<p class="from"></p>' +
            '<button class="reply-toggle" type="button">답장하기</button>' +
            '<form class="reply-form">' +
              '<textarea class="reply-text" rows="2" maxlength="1000" placeholder="답장을 적어보세요" autocomplete="off" spellcheck="false"></textarea>' +
              '<button class="reply-send" type="submit">보내기</button>' +
              '<p class="reply-note"></p>' +
            '</form>';

          card.querySelector('.original').textContent = m.body;
          card.querySelector('.from').textContent = m.from + '님이 보낸 ' + (m.kind === 'reply' ? '답장' : '편지');

          var toggle = card.querySelector('.reply-toggle');
          var form = card.querySelector('.reply-form');
          toggle.addEventListener('click', function () {
            form.classList.toggle('on');
            if (form.classList.contains('on')) form.querySelector('.reply-text').focus();
          });

          form.addEventListener('submit', function (e) {
            e.preventDefault();
            var textarea = form.querySelector('.reply-text');
            var note = form.querySelector('.reply-note');
            var sendBtn = form.querySelector('.reply-send');
            var text = textarea.value.trim();
            if (!text) return;

            sendBtn.disabled = true;
            note.textContent = '보내는 중…';

            apiFetch('/api/send-reply', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ letterId: m.letterId, body: text })
            }).then(function (res) {
              sendBtn.disabled = false;
              if (res.ok) {
                note.textContent = '답장을 보냈어요.';
                textarea.value = '';
                textarea.disabled = true;
                sendBtn.disabled = true;
              } else {
                note.textContent = '문제가 생겼어요. 잠시 후 다시 시도해주세요.';
              }
            }).catch(function () {
              sendBtn.disabled = false;
              note.textContent = '연결할 수 없어요. 잠시 후 다시 시도해주세요.';
            });
          });

          box.appendChild(card);
        });

        show('view-list');
      })
      .catch(function () { show('view-empty'); });
    }
  </script>
</body>
</html>
