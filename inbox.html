<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read — 받은 편지함</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;
      --text: #2c2c2c;
      --point: #6b7c3a;
      --paper-warm: #f7ece2;
      --paper-cool: #e2ece4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 24px 110px;
    }

    .view { display: none; width: 100%; max-width: 640px; }
    .view.on { display: flex; flex-direction: column; align-items: center; animation: fade 0.6s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .lead { font-size: clamp(16px, 3vw, 20px); text-align: center; margin-bottom: 40px; }
    .sub { font-size: 14px; text-align: center; margin-top: 20px; color: rgba(44, 44, 44, 0.55); }

    /* 편지지 카드 */
    .letters { display: flex; flex-direction: column; gap: 20px; width: 100%; }

    .letter {
      background: var(--paper-warm);
      border: none;
      border-radius: 4px;
      padding: 28px 28px 22px;
      font-family: inherit;
      letter-spacing: inherit;
      color: var(--text);
      text-align: left;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.08);
      transform: rotate(-0.6deg);
    }
    button.letter { cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    button.letter:hover {
      transform: rotate(0deg) translateY(-3px);
      box-shadow: 0 6px 18px rgba(44, 44, 44, 0.12);
    }

    .letter .original { font-size: 16px; line-height: 1.5; white-space: pre-line; }
    .letter .translated { font-size: 13px; line-height: 1.5; margin-top: 12px; color: rgba(44, 44, 44, 0.6); white-space: pre-line; }
    .letter .from { font-size: 12px; margin-top: 16px; color: rgba(44, 44, 44, 0.45); }

    /* 하단 독 */
    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
    }
    .dock a { color: var(--point); opacity: 0.8; transition: opacity 0.2s ease; display: flex; }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- ① 편지 목록 (아직 도착한 편지가 없을 때) -->
  <section class="view on" id="view-list">
    <p class="lead">아직, 도착한 편지가 없어요.</p>
    <p class="sub">누군가에게 답이 닿으면, 여기로 편지가 와요.</p>
  </section>

  <!-- 하단 독: 오늘의 질문 / 보내지 않은 편지 / 프로필 -->
  <nav class="dock">
    <a href="question.html" aria-label="오늘의 질문">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 L12 20 M4 12 L20 12"/>
      </svg>
    </a>
    <a href="unsent.html" aria-label="보내지 않은 편지">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3 a2.828 2.828 0 1 1 4 4 L7.5 20.5 L2 22 l1.5 -5.5 L17 3 z"/>
      </svg>
    </a>
    <a href="profile.html" aria-label="프로필">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/>
        <path d="M5 19.5 C6.5 15.5 9 14.5 12 14.5 C15 14.5 17.5 15.5 19 19.5"/>
      </svg>
    </a>
  </nav>

  <script>
    // 아직 받은 편지함은 실제 데이터와 연결되지 않았어요.
    // Supabase가 붙으면, 도착한 편지를 여기서 읽고 답장할 수 있게 됩니다.
  </script>
</body>
</html>
