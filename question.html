<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read — 오늘의 질문</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;          /* 죽인 레몬 */
      --text: #2c2c2c;        /* 소프트 블랙 */
      --point: #6b7c3a;       /* 올리브 그린 */
      --paper-warm: #f7ece2;  /* 같은 결 — 따뜻한 편지지 */
      --paper-cool: #e2ece4;  /* 다른 결 — 차분한 편지지 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* 화면(view) 전환 — 한 번에 하나만 보입니다 */
    .view { display: none; width: 100%; max-width: 640px; }
    .view.on { display: flex; flex-direction: column; align-items: center; }

    .fade { animation: fade 0.6s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* ① 오늘의 질문 */
    .question {
      font-size: clamp(20px, 4.2vw, 30px);
      font-weight: 500;
      text-align: center;
      margin-bottom: 56px;
    }

    .answer {
      width: 100%;
      max-width: 480px;
      background: transparent;
      border: none;
      resize: none;
      overflow: hidden;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: inherit;
      color: var(--text);
      caret-color: var(--text);
      text-align: center;
      outline: none;
      min-height: 1.5em;
    }

    .hint {
      margin-top: 40px;
      font-size: 12px;
      color: rgba(44, 44, 44, 0.4);
    }

    /* ② 결 고르기 */
    .ask { font-size: clamp(18px, 3.6vw, 24px); text-align: center; margin-bottom: 48px; }

    .tones { display: flex; flex-direction: column; gap: 24px; align-items: center; }

    .tone {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 18px;
      letter-spacing: inherit;
      color: var(--text);
      cursor: pointer;
      padding: 8px 16px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    .tone:hover { border-bottom-color: var(--text); }

    /* ③ 후보 — 편지지 카드 */
    .lead { font-size: clamp(16px, 3vw, 20px); text-align: center; margin-bottom: 40px; }
    #view-candidates .lead { margin-bottom: 14px; }
    .cand-note { font-size: 13px; text-align: center; color: rgba(44, 44, 44, 0.5); margin-bottom: 36px; }

    .letters { display: flex; flex-direction: column; gap: 20px; width: 100%; }

    .letter {
      background: var(--paper);
      border: none;
      border-radius: 4px;
      padding: 28px 28px 22px;
      font-family: inherit;
      letter-spacing: inherit;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .letter:nth-child(odd)  { transform: rotate(-0.6deg); }
    .letter:nth-child(even) { transform: rotate(0.5deg); }
    .letter:hover {
      transform: rotate(0deg) translateY(-3px);
      box-shadow: 0 6px 18px rgba(44, 44, 44, 0.12);
    }

    .letter .original { font-size: 16px; line-height: 1.5; }
    .letter .translated { font-size: 13px; line-height: 1.5; margin-top: 12px; color: rgba(44, 44, 44, 0.6); }
    .letter .from { font-size: 12px; margin-top: 16px; color: rgba(44, 44, 44, 0.45); }

    /* ④ 첫 편지 쓰기 */
    .letter.still { cursor: default; }
    .letter.still:hover { transform: rotate(-0.6deg); box-shadow: 0 2px 10px rgba(44, 44, 44, 0.08); }

    .letter-body {
      margin-top: 36px;
      text-align: left;
      min-height: 4.5em;
    }

    #view-write .home { margin-top: 36px; align-self: center; }

    /* ⑤ 보냈어요 */
    .sent-line { font-size: clamp(18px, 3.6vw, 24px); text-align: center; }
    .sent-sub { font-size: 14px; text-align: center; margin-top: 24px; color: rgba(44, 44, 44, 0.55); }

    .home {
      margin-top: 56px;
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .home:hover { opacity: 0.85; }

    /* 하단 독 — 받은 편지함 / 프로필 */
    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
    }
    .dock a {
      color: var(--point);
      opacity: 0.8;
      transition: opacity 0.2s ease;
      display: flex;
    }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- ① 오늘의 질문 -->
  <section class="view on fade" id="view-question">
    <h1 class="question" id="question-text"></h1>
    <textarea class="answer" id="answer" rows="1" autofocus maxlength="1000"
      placeholder="" autocomplete="off" spellcheck="false"></textarea>
    <p class="hint" id="answer-hint"></p>
  </section>

  <!-- ② 결 고르기 -->
  <section class="view" id="view-tone">
    <p class="ask" data-i18n="q.tone.ask"></p>
    <div class="tones">
      <button class="tone" data-tone="same" data-i18n="q.tone.same"></button>
      <button class="tone" data-tone="diff" data-i18n="q.tone.diff"></button>
    </div>
  </section>

  <!-- ③ 후보 세 사람 -->
  <section class="view" id="view-candidates">
    <p class="lead" id="lead"></p>
    <p class="cand-note" data-i18n="q.cand.oneADay"></p>
    <div class="letters" id="letters"></div>
  </section>

  <!-- ④ 첫 편지 쓰기 -->
  <section class="view" id="view-write">
    <p class="lead" data-i18n="q.write.lead"></p>
    <div class="letters" id="chosen"></div>
    <textarea class="answer letter-body" id="letter" rows="3" maxlength="1000"
      placeholder="" autocomplete="off" spellcheck="false"></textarea>
    <button class="home" id="send-letter" data-i18n="q.write.send"></button>
    <p class="hint" id="letter-note"></p>
  </section>

  <!-- 사람이 아직 안 모였을 때 -->
  <section class="view" id="view-wait">
    <p class="sent-line" data-i18n="q.wait.line"></p>
    <p class="sent-sub" data-i18n="q.wait.sub"></p>
    <button class="home" id="go-home-wait" data-i18n="q.home"></button>
  </section>

  <!-- ⑤ 편지가 떠났어요 -->
  <section class="view" id="view-sent">
    <p class="sent-line" data-i18n="q.sent.line"></p>
    <p class="sent-sub" data-i18n="q.sent.sub"></p>
    <button class="home" id="go-home" data-i18n="q.home"></button>
  </section>

  <!-- 하단 독: 받은 편지함 / 보내지 않은 편지 / 지도 / 프로필 -->
  <nav class="dock">
    <a href="inbox.html" data-i18n-aria="nav.inbox" aria-label="받은 편지함">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
    </a>
    <a href="unsent.html" data-i18n-aria="nav.unsent" aria-label="보내지 않은 편지">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3 a2.828 2.828 0 1 1 4 4 L7.5 20.5 L2 22 l1.5 -5.5 L17 3 z"/>
      </svg>
    </a>
    <a href="map.html" data-i18n-aria="nav.map" aria-label="지도">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12 L21 12"/>
        <path d="M12 3 C16.5 3 16.5 21 12 21 C7.5 21 7.5 3 12 3 Z"/>
      </svg>
    </a>
    <a href="profile.html" data-i18n-aria="nav.profile" aria-label="프로필">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/>
        <path d="M5 19.5 C6.5 15.5 9 14.5 12 14.5 C15 14.5 17.5 15.5 19 19.5"/>
      </svg>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="i18n.js"></script>
  <script src="questions.js"></script>
  <script>
    var QUESTION_INDEX = todayQuestionIndex();
    var ANSWER_DATE = todayDateString();

    var chosenAnswerId = null;

    // 오늘 이미 답했는지 / 오늘 편지를 보냈는지
    var alreadyAnswered = false;
    var existingTone = null;
    var sentToday = false;

    // 질문 본문과 입력칸 아래 안내문을 현재 언어로 칠해요 (언어가 바뀌면 다시 호출)
    function paintQuestion() {
      document.getElementById('question-text').textContent = todayQuestion();
    }
    function paintAnswerHint() {
      var h = document.getElementById('answer-hint');
      if (sentToday) h.innerHTML = t('q.hint.sentToday');
      else if (alreadyAnswered) h.innerHTML = t('q.hint.answered');
      else h.innerHTML = t('q.hint');
    }
    paintQuestion();
    paintAnswerHint();

    // 언어가 바뀌면(다른 기기에서 처음 로그인 등) JS로 만든 글자도 다시 칠해요
    document.addEventListener('i18n:changed', function () {
      paintQuestion();
      paintAnswerHint();
    });

    // 로그인 안 돼 있으면 첫 화면으로 돌려보내고, 로그인돼 있으면 오늘 쓴 답을 불러와요
    requireLogin().then(function (token) {
      if (!token) return;
      loadTodayAnswer();
    });

    // 오늘 이미 쓴 답이 있으면 그대로 채워넣어요 (자정까지 유지). sentToday면 흐름을 막아요.
    function loadTodayAnswer() {
      apiFetch('/api/my-answer?date=' + encodeURIComponent(ANSWER_DATE))
        .then(function (res) { return res.json(); })
        .then(function (data) {
          sentToday = !!(data && data.sentToday);
          var a = data && data.answer;
          if (a) {
            alreadyAnswered = true;
            existingTone = a.tone;
            answerText = a.body;
            answer.value = a.body;
            answer.style.height = 'auto';
            answer.style.height = answer.scrollHeight + 'px';
          }
          paintAnswerHint();
        })
        .catch(function () {});
    }

    // 답변을 서버에 보내고, 결과(매칭/대기)를 받아옵니다.
    // apiFetch가 로그인 출입증(토큰)을 자동으로 붙여줘요.
    // editOnly=true면 내용만 고치는 거라 재매칭·알림메일이 일어나지 않아요.
    function submitAnswer(tone, text, editOnly) {
      return apiFetch('/api/submit-answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          questionIndex: QUESTION_INDEX,
          answerDate: ANSWER_DATE,
          tone: tone,
          body: text,
          editOnly: editOnly === true
        })
      }).then(function (res) { return res.json(); });
    }

    function show(id) {
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('on', 'fade'); });
      var el = document.getElementById(id);
      el.classList.add('on', 'fade');
    }

    // ① 답변 — 엔터로 다음 단계
    var answerText = '';
    var answer = document.getElementById('answer');
    answer.addEventListener('input', function () {
      answer.style.height = 'auto';
      answer.style.height = answer.scrollHeight + 'px';
    });
    answer.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!answer.value.trim()) return;
        answerText = answer.value.trim();
        // 오늘 이미 편지를 보냈으면 — 내용만 고쳐 저장 (하루 한 명 규칙)
        if (sentToday) { saveEdit(); return; }
        // 처음이든 다시 들어왔든 동일하게: 결 선택 → 후보군
        show('view-tone');
      }
    });

    // 오늘 답을 고쳐 저장 (결은 처음 고른 그대로, 재매칭 없음)
    function saveEdit() {
      var hint = document.getElementById('answer-hint');
      hint.textContent = t('q.saving');
      submitAnswer(existingTone, answerText, true).then(function (data) {
        hint.textContent = (data && data.status === 'saved') ? t('q.saved') : t('q.saveFail');
      }).catch(function () {
        hint.textContent = t('q.saveFail');
      });
    }

    // 후보(오늘 답한 사람들)를 편지지 카드로 그려요. 누르면 그 사람에게 편지 쓰기.
    function renderCandidates(pool) {
      pool = pool || [];
      document.getElementById('lead').textContent = t('q.cand.lead');
      var box = document.getElementById('letters');
      box.innerHTML = '';
      pool.forEach(function (c, idx) {
        var b = document.createElement('button');
        b.className = 'letter';
        b.dataset.answerId = c.id;
        b.style.setProperty('--paper', idx % 2 === 0 ? 'var(--paper-warm)' : 'var(--paper-cool)');

        // 다른 사람이 적은 내용은 textContent로만 넣습니다.
        // (innerHTML로 합치면 답 안에 숨긴 코드가 받는 사람 화면에서 실행될 수 있어요)
        var pOrig = document.createElement('p');
        pOrig.className = 'original';
        pOrig.textContent = c.original;
        b.appendChild(pOrig);

        if (c.translated) {
          var pTrans = document.createElement('p');
          pTrans.className = 'translated';
          pTrans.textContent = c.translated;
          b.appendChild(pTrans);
        }

        // 닉네임 + 어떤 언어를 쓰는 사람인지 (외국인이면 감안할 수 있게)
        var pFrom = document.createElement('p');
        pFrom.className = 'from';
        pFrom.textContent = c.from + (c.lang ? ' · ' + langLabel(c.lang) : '');
        b.appendChild(pFrom);

        b.addEventListener('click', function () {
          chosenAnswerId = c.id;
          var chosen = document.getElementById('chosen');
          chosen.innerHTML = '';
          var card = b.cloneNode(true);
          card.classList.add('still');
          chosen.appendChild(card);
          show('view-write');
          document.getElementById('letter').focus();
        });
        box.appendChild(b);
      });
    }

    // ② 결 고르기 → 후보 그리기 (대기면 view-wait)
    document.querySelectorAll('.tone').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tone = btn.dataset.tone;
        btn.disabled = true;

        submitAnswer(tone, answerText).then(function (data) {
          btn.disabled = false;
          alreadyAnswered = true;
          existingTone = tone;
          if (!data || data.status !== 'matched') { show('view-wait'); return; }
          renderCandidates(data.candidates);
          show('view-candidates');
        }).catch(function () {
          btn.disabled = false;
          show('view-wait');
        });
      });
    });


    // 편지 칸도 쓰는 만큼 늘어나도록
    var letterBox = document.getElementById('letter');
    letterBox.addEventListener('input', function () {
      letterBox.style.height = 'auto';
      letterBox.style.height = letterBox.scrollHeight + 'px';
    });

    // ④ 편지 보내기
    document.getElementById('send-letter').addEventListener('click', function () {
      var letter = document.getElementById('letter');
      var note = document.getElementById('letter-note');
      var btn = document.getElementById('send-letter');
      if (!letter.value.trim() || !chosenAnswerId) return;

      btn.disabled = true;
      note.textContent = t('q.sending');

      apiFetch('/api/send-letter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          toAnswerId: chosenAnswerId,
          body: letter.value.trim()
        })
      }).then(function (res) {
        btn.disabled = false;
        if (res.ok) {
          show('view-sent');
        } else if (res.status === 409) {
          note.textContent = t('q.onePerDay'); // 오늘 이미 한 통 보냄
        } else {
          note.textContent = t('q.sendFail');
        }
      }).catch(function () {
        btn.disabled = false;
        note.textContent = t('q.connFail');
      });
    });

    // 처음으로 — 오늘의 질문 화면을 새로 엽니다
    function goHome() { window.location.reload(); }
    document.getElementById('go-home').addEventListener('click', goHome);
    document.getElementById('go-home-wait').addEventListener('click', goHome);
  </script>
</body>
</html>
