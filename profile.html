<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read — 프로필</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;
      --text: #2c2c2c;
      --point: #6b7c3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .name-line { font-size: clamp(18px, 3.6vw, 24px); text-align: center; }
    .mail-line { font-size: 14px; text-align: center; margin-top: 20px; color: rgba(44, 44, 44, 0.55); }
    .lang-line { font-size: 14px; text-align: center; margin-top: 8px; color: rgba(44, 44, 44, 0.55); }

    select.field {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    /* 수정 모드 — 랜딩과 같은 밑줄 입력칸 */
    #edit-form {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 320px;
    }
    #edit-form.on { display: flex; }

    .field {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 16px;
      letter-spacing: inherit;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .field::placeholder { color: rgba(44, 44, 44, 0.4); }
    .field:focus { border-bottom-color: var(--text); }

    .save {
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .save:hover { opacity: 0.85; }

    .actions { display: flex; gap: 32px; margin-top: 56px; }

    .leave, .edit {
      margin-top: 0;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.45);
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
      background: none;
      border-top: none; border-left: none; border-right: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
    }
    .leave:hover, .edit:hover { color: var(--text); border-bottom-color: var(--text); }

    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
    }
    .dock a { color: var(--point); opacity: 0.8; transition: opacity 0.2s ease; display: flex; }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>
  <p class="name-line" id="name-line"></p>
  <p class="mail-line" id="mail-line"></p>
  <p class="lang-line" id="lang-line"></p>

  <!-- 수정 모드: 평소엔 숨겨져 있어요 -->
  <form id="edit-form">
    <input class="field" type="text" id="edit-nick" data-i18n-ph="profile.nickPlaceholder" placeholder="이름 혹은 별명" autocomplete="off" />
    <select class="field" id="edit-lang" aria-label="편지를 받을 언어"></select>
    <button class="save" type="submit" data-i18n="profile.save"></button>
  </form>

  <div class="actions" id="actions">
    <button class="edit" id="edit" data-i18n="profile.edit"></button>
    <button class="leave" id="leave" data-i18n="profile.leave"></button>
  </div>

  <nav class="dock">
    <a href="question.html" data-i18n-aria="nav.question" aria-label="오늘의 질문">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 L12 20 M4 12 L20 12"/>
      </svg>
    </a>
    <a href="inbox.html" data-i18n-aria="nav.inbox" aria-label="받은 편지함">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
    </a>
    <a href="unsent.html" data-i18n-aria="nav.unsent" aria-label="보내지 않은 편지">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3 a2.828 2.828 0 1 1 4 4 L7.5 20.5 L2 22 l1.5 -5.5 L17 3 z"/>
      </svg>
    </a>
    <a href="map.html" data-i18n-aria="nav.map" aria-label="지도">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12 L21 12"/>
        <path d="M12 3 C16.5 3 16.5 21 12 21 C7.5 21 7.5 3 12 3 Z"/>
      </svg>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="i18n.js"></script>
  <script>
    // 편지를 받을 언어 — 나중에 번역 API의 목표 언어가 됩니다
    var LANGS = {
      ko: '한국어', en: 'English', ja: '日本語', zh: '中文(简体)', zht: '中文(繁體)',
      es: 'Español', fr: 'Français', de: 'Deutsch', pt: 'Português', it: 'Italiano',
      ru: 'Русский', ar: 'العربية', hi: 'हिन्दी', bn: 'বাংলা', id: 'Bahasa Indonesia',
      vi: 'Tiếng Việt', th: 'ไทย', tr: 'Türkçe', pl: 'Polski', nl: 'Nederlands',
      sv: 'Svenska', uk: 'Українська', el: 'Ελληνικά', cs: 'Čeština', ro: 'Română',
      hu: 'Magyar', fi: 'Suomi', da: 'Dansk', no: 'Norsk', he: 'עברית',
      fa: 'فارسی', ms: 'Bahasa Melayu', fil: 'Filipino', sw: 'Kiswahili'
    };

    var langSelect = document.getElementById('edit-lang');
    Object.keys(LANGS).forEach(function (code) {
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = LANGS[code];
      langSelect.appendChild(opt);
    });

    var me = null; // 로그인한 사용자(세션 정보)

    function metaNick() { return (me && me.user_metadata && me.user_metadata.nickname) || localStorage.getItem('wr_nickname') || ''; }
    function metaLang() { return (me && me.user_metadata && me.user_metadata.lang) || localStorage.getItem('wr_lang') || 'ko'; }

    function render() {
      var nick = metaNick() || t('profile.noName');
      var mail = (me && me.email) || '';
      var lang = metaLang();
      document.getElementById('name-line').textContent = t('profile.name', { nick: nick });
      document.getElementById('mail-line').textContent = mail ? t('profile.mail', { mail: mail }) : '';
      document.getElementById('lang-line').textContent = t('profile.lang', { lang: (LANGS[lang] || 'English') });
    }

    // 로그인 확인 + 내 계정 정보 불러오기
    requireLogin().then(function (token) {
      if (!token) return;
      sb.auth.getUser().then(function (res) {
        me = res && res.data ? res.data.user : null;
        render();
      });
    });

    // 언어가 바뀌면(다른 기기에서 처음 로그인 등) 동적 문장도 다시 그려요
    document.addEventListener('i18n:changed', render);

    function setEditMode(on) {
      document.getElementById('name-line').style.display = on ? 'none' : '';
      document.getElementById('mail-line').style.display = on ? 'none' : '';
      document.getElementById('lang-line').style.display = on ? 'none' : '';
      document.getElementById('actions').style.display = on ? 'none' : '';
      document.getElementById('edit-form').classList.toggle('on', on);
    }

    // 수정하기 — 이름/언어가 입력칸으로 바뀝니다 (이메일은 로그인 아이디라 바꿀 수 없어요)
    document.getElementById('edit').addEventListener('click', function () {
      document.getElementById('edit-nick').value = metaNick();
      langSelect.value = metaLang();
      setEditMode(true);
      document.getElementById('edit-nick').focus();
    });

    // 저장하기 — 이름/언어를 내 계정에 저장하고 원래 화면으로
    document.getElementById('edit-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var nick = document.getElementById('edit-nick').value.trim();
      var lang = langSelect.value;
      if (!nick) return;

      // ① 내 계정 메타데이터(어느 기기에서 로그인해도 따라옴)
      sb.auth.updateUser({ data: { nickname: nick, lang: lang } });
      // ② users 테이블(다른 사람에게 보이는 이름) — 인증된 요청으로만
      apiFetch('/api/update-profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname: nick, lang: lang })
      });

      localStorage.setItem('wr_nickname', nick);
      localStorage.setItem('wr_lang', lang);
      if (me) { me.user_metadata = me.user_metadata || {}; me.user_metadata.nickname = nick; me.user_metadata.lang = lang; }
      setEditMode(false);
      applyI18n(); // 고정 글자(버튼·독)를 새 언어로
      render();    // 동적 문장(이름·메일·언어 안내)을 새 언어로
    });

    // 로그아웃 — 세션을 끊고 처음으로
    document.getElementById('leave').addEventListener('click', function () {
      signOutAndLeave();
    });
  </script>
</body>
</html>
