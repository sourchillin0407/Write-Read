<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dear — 지도</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #eef2c8;
      --text: #2c2c2c;
      --point: #6b7c3a;
      --paper-warm: #f7ece2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 56px 24px 110px;
    }

    .wrap { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: clamp(18px, 3.6vw, 24px); text-align: center; }
    .sub { font-size: 14px; text-align: center; margin-top: 16px; color: rgba(44, 44, 44, 0.55); }

    #map {
      width: 100%;
      height: 70vh;
      min-height: 360px;
      margin-top: 32px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.1);
    }
    #map.placing { cursor: crosshair; }

    .placing-note {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      margin-top: 20px;
      color: var(--point);
      text-align: center;
    }
    .placing-note.on { display: flex; }

    .place-input {
      width: 100%;
      max-width: 320px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: inherit;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .place-input::placeholder { color: rgba(44, 44, 44, 0.35); }
    .place-input:focus { border-bottom-color: var(--text); }

    #place-results { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .place-option {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: var(--text);
      cursor: pointer;
      padding: 2px 4px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    .place-option:hover { border-bottom-color: var(--text); }

    .tool {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.5);
      cursor: pointer;
      padding: 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .tool:hover { color: var(--text); border-bottom-color: var(--text); }

    .tool.here { color: var(--point); }
    .tool.here:hover { color: var(--point); border-bottom-color: var(--point); }

    .goto-me { margin-top: 20px; }

    .leaflet-popup-content { font-family: 'Pretendard', 'Noto Sans', sans-serif; letter-spacing: 0.03em; line-height: 1.5; }

    /* 팝업 내용 */
    .pop-body { font-size: 14px; line-height: 1.5; white-space: pre-line; }
    .pop-meta { font-size: 12px; color: rgba(44, 44, 44, 0.6); margin-top: 8px; }
    .pop-sub  { font-size: 12px; color: rgba(44, 44, 44, 0.5); margin-top: 6px; }
    .pop-date { font-size: 11px; color: rgba(44, 44, 44, 0.4); margin-top: 2px; }

    /* 댓글 토글 + 펼쳐지는 영역 */
    .pop-cmt-toggle {
      margin-top: 12px; background: none; border: none; padding: 0; cursor: pointer;
      font-family: inherit; font-size: 12px; color: var(--point);
      border-bottom: 1px solid transparent; transition: border-color 0.2s ease;
    }
    .pop-cmt-toggle:hover { border-bottom-color: var(--point); }
    .pop-cmts { margin-top: 10px; max-height: 180px; overflow-y: auto; }
    .cmt { padding: 8px 0; border-top: 1px solid rgba(44, 44, 44, 0.1); }
    .cmt-body { font-size: 13px; line-height: 1.45; white-space: pre-line; }
    .cmt-who { font-size: 11px; color: rgba(44, 44, 44, 0.45); margin-top: 4px; }
    .cmt-none { font-size: 12px; color: rgba(44, 44, 44, 0.45); padding: 6px 0; }
    .cmt-form { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .cmt-input {
      width: 100%; box-sizing: border-box; resize: none;
      border: none; border-bottom: 1px solid rgba(44, 44, 44, 0.3); background: transparent;
      font-family: inherit; font-size: 13px; line-height: 1.4; color: var(--text);
      outline: none; padding: 4px 2px;
    }
    .cmt-send {
      align-self: flex-end; background: var(--point); color: #f4f6e0;
      border: none; border-radius: 999px; padding: 5px 16px;
      font-family: inherit; font-size: 12px; cursor: pointer; transition: opacity 0.2s ease;
    }
    .cmt-send:hover { opacity: 0.85; }

    /* 하단 독 */
    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      z-index: 1000;
    }
    .dock a { color: var(--point); opacity: 0.8; transition: opacity 0.2s ease; display: flex; }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title" data-i18n="map.title"></p>
    <p class="sub" data-i18n="map.sub"></p>

    <div class="placing-note" id="placing-note">
      <span id="placing-msg" data-i18n="map.placingMsg"></span>
      <input class="place-input" id="place-input" type="text"
        data-i18n-ph="map.placeholder" placeholder="예: 서울 성수동, Shibuya, Montmartre" autocomplete="off" />
      <button class="tool here" id="place-search" data-i18n="map.search"></button>
      <div id="place-results"></div>
      <button class="tool here" id="place-here" data-i18n="map.here"></button>
    </div>

    <div id="map"></div>
    <button class="tool goto-me" id="goto-me" data-i18n="map.gotoMe"></button>
  </div>

  <!-- 하단 독: 오늘의 질문 / 받은 편지함 / 보내지 않은 편지 / 프로필 -->
  <nav class="dock">
    <a href="question.html" data-i18n-aria="nav.question" aria-label="오늘의 질문">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 L12 20 M4 12 L20 12"/>
      </svg>
    </a>
    <a href="inbox.html" data-i18n-aria="nav.inbox" aria-label="받은 편지함">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
    </a>
    <a href="unsent.html" data-i18n-aria="nav.unsent" aria-label="보내지 않은 편지">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3 a2.828 2.828 0 1 1 4 4 L7.5 20.5 L2 22 l1.5 -5.5 L17 3 z"/>
      </svg>
    </a>
    <a href="profile.html" data-i18n-aria="nav.profile" aria-label="프로필">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/>
        <path d="M5 19.5 C6.5 15.5 9 14.5 12 14.5 C15 14.5 17.5 15.5 19 19.5"/>
      </svg>
    </a>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="i18n.js"></script>
  <script>
    // ── 지도에 공개된 편지들은 Supabase에 저장돼 전 세계가 함께 봐요 (공개 후 3일).

    // 로그인 확인 (지도에 공개하려면 로그인 필요)
    requireLogin();

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = (s == null) ? '' : s;
      return d.innerHTML;
    }

    // 올린 날짜·시간 (보는 사람 기준 YYYY.M.D HH:MM)
    function fmtDateTime(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate() +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    // 지도 편지 팝업 — 본문 / 주소 / 닉네임·언어 / 날짜 + 댓글 토글(누르면 펼쳐짐)
    function buildPopup(l) {
      var wrap = document.createElement('div');

      var b = document.createElement('p');
      b.className = 'pop-body';
      b.textContent = l.body || '';
      wrap.appendChild(b);

      if (l.place) {
        var pl = document.createElement('p');
        pl.className = 'pop-meta';
        pl.textContent = '📍 ' + l.place;
        wrap.appendChild(pl);
      }

      var sub = document.createElement('p');
      sub.className = 'pop-sub';
      sub.textContent = (l.nickname || '익명') + (l.lang ? ' · ' + langLabel(l.lang) : '');
      wrap.appendChild(sub);

      if (l.created_at) {
        var dt = document.createElement('p');
        dt.className = 'pop-date';
        dt.textContent = fmtDateTime(l.created_at);
        wrap.appendChild(dt);
      }

      // 💬 댓글 N개 (없으면 '댓글 달기') — 누르면 아래로 펼쳐져요
      var n = l.commentCount || 0;
      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'pop-cmt-toggle';
      toggle.textContent = '💬 ' + (n > 0 ? t('cmt.count', { n: n }) : t('cmt.add'));
      wrap.appendChild(toggle);

      var box = document.createElement('div');
      box.className = 'pop-cmts';
      box.style.display = 'none';
      wrap.appendChild(box);

      var loaded = false;
      toggle.addEventListener('click', function () {
        if (box.style.display === 'none') {
          box.style.display = 'block';
          if (!loaded) { loaded = true; loadComments(l.id, box); }
        } else {
          box.style.display = 'none';
        }
      });

      return wrap;
    }

    // 댓글 목록 + 입력칸을 box 안에 그려요
    function loadComments(letterId, box) {
      box.innerHTML = '';
      var loading = document.createElement('p');
      loading.className = 'cmt-none';
      loading.textContent = t('cmt.loading');
      box.appendChild(loading);

      apiFetch('/api/comments?letterId=' + encodeURIComponent(letterId))
        .then(function (res) { return res.json(); })
        .then(function (data) {
          box.innerHTML = '';
          var list = data.comments || [];
          if (!list.length) {
            var none = document.createElement('p');
            none.className = 'cmt-none';
            none.textContent = t('cmt.none');
            box.appendChild(none);
          } else {
            list.forEach(function (c) {
              var item = document.createElement('div');
              item.className = 'cmt';
              var cb = document.createElement('p');
              cb.className = 'cmt-body';
              cb.textContent = c.body; // 댓글 내용 — textContent로만 안전하게
              item.appendChild(cb);
              var cw = document.createElement('p');
              cw.className = 'cmt-who';
              cw.textContent = (c.nickname || '익명') + (c.lang ? ' · ' + langLabel(c.lang) : '');
              item.appendChild(cw);
              box.appendChild(item);
            });
          }

          // 댓글 입력
          var form = document.createElement('form');
          form.className = 'cmt-form';
          var ta = document.createElement('textarea');
          ta.className = 'cmt-input';
          ta.rows = 2; ta.maxLength = 1000;
          ta.placeholder = t('cmt.placeholder');
          ta.autocomplete = 'off';
          var send = document.createElement('button');
          send.type = 'submit';
          send.className = 'cmt-send';
          send.textContent = t('cmt.send');
          form.appendChild(ta);
          form.appendChild(send);
          box.appendChild(form);

          form.addEventListener('submit', function (e) {
            e.preventDefault();
            var txt = ta.value.trim();
            if (!txt) return;
            send.disabled = true;
            apiFetch('/api/comment', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ letterId: letterId, body: txt })
            }).then(function (res) {
              if (res.ok) {
                loadComments(letterId, box); // 새 댓글 반영 (팝업은 그대로 열려 있어요)
              } else {
                send.disabled = false;
              }
            }).catch(function () { send.disabled = false; });
          });
        })
        .catch(function () {
          box.innerHTML = '';
          var none = document.createElement('p');
          none.className = 'cmt-none';
          none.textContent = t('cmt.none');
          box.appendChild(none);
        });
    }

    // ── 지도 (밝고 차분한 타일 — 사이트 톤에 맞춰서)
    var map = L.map('map', { worldCopyJump: true }).setView([24, 10], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    // ── 전 세계 공개 편지를 불러와 표시 (3일 이내). 버블은 작게(겹침 방지), 팝업에 닉네임·언어.
    var markers = [];
    function loadWall() {
      apiFetch('/api/wall')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          markers.forEach(function (m) { map.removeLayer(m); });
          markers = [];
          (data.letters || []).forEach(function (l) {
            if (typeof l.lat !== 'number' || typeof l.lng !== 'number') return;
            var m = L.circleMarker([l.lat, l.lng], {
              radius: 3.5, color: '#6b7c3a', weight: 1.5,
              fillColor: '#f7ece2', fillOpacity: 0.95
            }).addTo(map).bindPopup(buildPopup(l), { maxWidth: 300, minWidth: 200 });
            markers.push(m);
          });
        })
        .catch(function () {});
    }

    // ── 지도에 공개: 자리를 정하면 서버에 올려요
    var placing = null; // { idx, text }
    function startPlacing(p) {
      placing = p;
      document.getElementById('placing-msg').textContent = t('map.placingMsg');
      document.getElementById('place-input').value = '';
      document.getElementById('placing-note').classList.add('on');
      document.getElementById('place-input').focus();
    }

    function placeAt(spot, place) {
      if (!placing) return;
      var text = placing.text, idx = placing.idx;
      document.getElementById('placing-msg').textContent = t('map.searching');
      apiFetch('/api/place-letter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: text, place: place || '', lat: spot[0], lng: spot[1] })
      }).then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) {
          placing = null;
          document.getElementById('placing-note').classList.remove('on');
          if (data && data.id != null) markPublished(idx, data.id); // 서랍에 '공개됨' 표시
          map.setView(spot, 11);
          loadWall();
        })
        .catch(function () {
          document.getElementById('placing-msg').textContent = t('map.notFound');
        });
    }

    // unsent.html과 공유하는 localStorage에 공개 상태를 기록 (서랍 표시용)
    function markPublished(idx, wallId) {
      if (idx == null) return;
      try {
        var arr = JSON.parse(localStorage.getItem('wr_unsent') || '[]');
        if (arr[idx]) {
          arr[idx].published = true;
          arr[idx].publishedAt = Date.now();
          arr[idx].wallId = wallId;
          localStorage.setItem('wr_unsent', JSON.stringify(arr));
        }
      } catch (e) {}
    }

    // 사이트 언어에 맞춰 장소 이름을 돌려주도록 — Photon은 en/de/fr/it 지원, 그 외엔 현지어(default)
    function geoLang() {
      return ({ en: 'en', de: 'de', fr: 'fr', it: 'it' })[uiLang()] || 'default';
    }

    // 좌표 → 주소 (GPS로 둘 때 주소를 자동으로 채워요). 실패하면 빈 문자열.
    function reverseGeocode(spot, cb) {
      fetch('https://photon.komoot.io/reverse?lang=' + geoLang() + '&lat=' + spot[0] + '&lon=' + spot[1])
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var f = j.features && j.features[0];
          if (!f) { cb(''); return; }
          var p = f.properties || {};
          var label = [p.name, p.district, p.city || p.county, p.state, p.country]
            .filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ');
          cb(label || '');
        })
        .catch(function () { cb(''); });
    }

    // 같은 라벨의 후보가 여러 개 나오면 하나만 남겨요 (예: 역·구·동네가 같은 이름)
    function dedupe(list) {
      var seen = {};
      return list.filter(function (o) {
        if (!o.label || seen[o.label]) return false;
        seen[o.label] = 1; return true;
      });
    }

    // ── 주소 → 후보 자리들 (무료 주소 검색)
    //  - photonOnly=true: 타이핑 자동완성용 (가벼운 Photon만)
    //  - 평소(검색 버튼/엔터): Photon으로 먼저, 없으면 Nominatim으로 한 번 더 (정확도 ↑)
    function geocode(query, ok, fail, photonOnly) {
      fetch('https://photon.komoot.io/api/?limit=8&lang=' + geoLang() + '&q=' + encodeURIComponent(query))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.features && j.features.length) {
            ok(dedupe(j.features.map(function (f) {
              var p = f.properties;
              var label = [p.name, p.district, p.city || p.county, p.state, p.country]
                .filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ');
              return { spot: [f.geometry.coordinates[1], f.geometry.coordinates[0]], label: label };
            })));
          } else if (photonOnly) {
            fail();
          } else {
            // 못 찾으면 Nominatim으로 한 번 더 (사이트 언어로 결과 요청)
            return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=8&accept-language=' + uiLang() + '&q=' + encodeURIComponent(query))
              .then(function (r) { return r.json(); })
              .then(function (list) {
                if (list && list.length) {
                  ok(dedupe(list.map(function (item) {
                    return { spot: [parseFloat(item.lat), parseFloat(item.lon)], label: item.display_name };
                  })));
                } else fail();
              });
          }
        })
        .catch(fail);
    }

    // 후보들을 버튼 목록으로 그려요 (누르면 그 자리에 편지를 둠)
    function renderOptions(options) {
      var results = document.getElementById('place-results');
      results.innerHTML = '';
      options.forEach(function (o) {
        var b = document.createElement('button');
        b.className = 'place-option';
        b.textContent = o.label;
        b.addEventListener('click', function () {
          results.innerHTML = '';
          placeAt(o.spot, o.label); // 고른 주소도 함께 저장
        });
        results.appendChild(b);
      });
    }
    function showResults(options) {
      document.getElementById('placing-msg').textContent =
        options.length > 1 ? t('map.confirmMany') : t('map.confirmOne');
      renderOptions(options);
    }

    function searchAndPlace() {
      var q = document.getElementById('place-input').value.trim();
      if (!q) return;
      document.getElementById('placing-msg').textContent = t('map.searching');
      document.getElementById('place-results').innerHTML = '';
      geocode(q, showResults, function () {
        document.getElementById('placing-msg').textContent = t('map.notFound');
      });
    }

    document.getElementById('place-search').addEventListener('click', searchAndPlace);
    document.getElementById('place-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); searchAndPlace(); }
    });

    // 타이핑하면 후보가 실시간으로 떠요 (자동완성). 가볍게 Photon만 호출해요.
    var acTimer = null;
    document.getElementById('place-input').addEventListener('input', function () {
      clearTimeout(acTimer);
      var q = this.value.trim();
      if (q.length < 2) { document.getElementById('place-results').innerHTML = ''; return; }
      acTimer = setTimeout(function () {
        geocode(q, showResults, function () {}, true);
      }, 350);
    });

    // ── GPS: 브라우저에 위치 권한을 물어봅니다
    function locate(ok, fail) {
      if (!navigator.geolocation) { fail(); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) { ok([pos.coords.latitude, pos.coords.longitude]); },
        function () { fail(); },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // "지금 내가 있는 자리에 두기"
    document.getElementById('place-here').addEventListener('click', function () {
      locate(function (spot) {
        document.getElementById('placing-msg').textContent = t('map.searching');
        reverseGeocode(spot, function (label) { placeAt(spot, label); }); // 좌표 → 주소 자동
      }, function () {
        document.getElementById('placing-msg').textContent = t('map.noLocPlace');
      });
    });

    // "내가 있는 곳으로" — 지도만 내 위치로 이동
    document.getElementById('goto-me').addEventListener('click', function () {
      locate(function (spot) {
        map.setView(spot, 12);
      }, function () {
        alert(t('map.noLocAlert'));
      });
    });

    loadWall();

    // unsent.html에서 "지도에 공개하기"를 누르고 넘어온 경우 — 바로 자리 정하기를 시작합니다
    var pendingRaw = localStorage.getItem('wr_placing');
    if (pendingRaw) {
      localStorage.removeItem('wr_placing');
      try {
        var p = JSON.parse(pendingRaw);
        if (p && p.text) {
          startPlacing(p);
          document.getElementById('placing-note').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
