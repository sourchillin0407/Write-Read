<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read — 지도</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #eef2c8;
      --text: #2c2c2c;
      --point: #6b7c3a;
      --paper-warm: #f7ece2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 56px 24px 110px;
    }

    .wrap { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; }

    .title { font-size: clamp(18px, 3.6vw, 24px); text-align: center; }
    .sub { font-size: 14px; text-align: center; margin-top: 16px; color: rgba(44, 44, 44, 0.55); }

    #map {
      width: 100%;
      height: 70vh;
      min-height: 360px;
      margin-top: 32px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(44, 44, 44, 0.1);
    }
    #map.placing { cursor: crosshair; }

    .placing-note {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      margin-top: 20px;
      color: var(--point);
      text-align: center;
    }
    .placing-note.on { display: flex; }

    .place-input {
      width: 100%;
      max-width: 320px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: inherit;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .place-input::placeholder { color: rgba(44, 44, 44, 0.35); }
    .place-input:focus { border-bottom-color: var(--text); }

    #place-results { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .place-option {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: var(--text);
      cursor: pointer;
      padding: 2px 4px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    .place-option:hover { border-bottom-color: var(--text); }

    .tool {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.5);
      cursor: pointer;
      padding: 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .tool:hover { color: var(--text); border-bottom-color: var(--text); }

    .tool.here { color: var(--point); }
    .tool.here:hover { color: var(--point); border-bottom-color: var(--point); }

    .goto-me { margin-top: 20px; }

    .leaflet-popup-content { font-family: 'Pretendard', 'Noto Sans', sans-serif; letter-spacing: 0.03em; line-height: 1.5; }

    /* 하단 독 */
    .dock {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      z-index: 1000;
    }
    .dock a { color: var(--point); opacity: 0.8; transition: opacity 0.2s ease; display: flex; }
    .dock a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">떠도는 편지들</p>
    <p class="sub">공개된 편지는, 그 편지가 놓인 자리에서 누구나 주울 수 있어요.</p>

    <div class="placing-note" id="placing-note">
      <span id="placing-msg">이 편지를 둘 곳의 주소나 장소 이름을 적어주세요.</span>
      <input class="place-input" id="place-input" type="text"
        placeholder="예: 서울 성수동, Shibuya, Montmartre" autocomplete="off" />
      <button class="tool here" id="place-search">자리 찾기</button>
      <div id="place-results"></div>
      <button class="tool here" id="place-here">아니면 — 지금 내가 있는 자리에 두기</button>
    </div>

    <div id="map"></div>
    <button class="tool goto-me" id="goto-me">내가 있는 곳으로</button>
  </div>

  <!-- 하단 독: 오늘의 질문 / 받은 편지함 / 보내지 않은 편지 / 프로필 -->
  <nav class="dock">
    <a href="question.html" aria-label="오늘의 질문">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4 L12 20 M4 12 L20 12"/>
      </svg>
    </a>
    <a href="inbox.html" aria-label="받은 편지함">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
    </a>
    <a href="unsent.html" aria-label="보내지 않은 편지">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3 a2.828 2.828 0 1 1 4 4 L7.5 20.5 L2 22 l1.5 -5.5 L17 3 z"/>
      </svg>
    </a>
    <a href="profile.html" aria-label="프로필">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/>
        <path d="M5 19.5 C6.5 15.5 9 14.5 12 14.5 C15 14.5 17.5 15.5 19 19.5"/>
      </svg>
    </a>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── 보내지 않은 편지 중 "공개"로 둔 것들 — 지금은 내 브라우저(localStorage)에만 저장돼요.
    //    나중에 Supabase가 붙으면 전세계의 공개 편지가 여기에 함께 표시됩니다.

    var letters = JSON.parse(localStorage.getItem('wr_unsent') || '[]');
    function persist() { localStorage.setItem('wr_unsent', JSON.stringify(letters)); }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── 지도 (밝고 차분한 타일 — 사이트 톤에 맞춰서)
    var map = L.map('map', { worldCopyJump: true }).setView([24, 10], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    var markers = [];
    function drawMarkers() {
      markers.forEach(function (m) { map.removeLayer(m); });
      markers = [];
      letters.forEach(function (l) {
        if (l.public && l.spot) {
          var m = L.circleMarker(l.spot, {
            radius: 7, color: '#6b7c3a', weight: 1.5,
            fillColor: '#f7ece2', fillOpacity: 0.95
          }).addTo(map).bindPopup(escapeHtml(l.text) + '<br/><small>— 나의 편지</small>');
          markers.push(m);
        }
      });
    }

    // ── 지도에 두기: 주소를 적어서 자리를 정합니다
    var placingIndex = null;
    function startPlacing(i) {
      placingIndex = i;
      document.getElementById('placing-msg').textContent = '이 편지를 둘 곳의 주소나 장소 이름을 적어주세요.';
      document.getElementById('place-input').value = '';
      document.getElementById('placing-note').classList.add('on');
      document.getElementById('place-input').focus();
    }

    function placeAt(spot, placeName) {
      if (placingIndex === null) return;
      letters[placingIndex].public = true;
      letters[placingIndex].spot = spot;
      letters[placingIndex].place = placeName || '';
      placingIndex = null;
      document.getElementById('placing-note').classList.remove('on');
      map.setView(spot, 13);
      persist(); drawMarkers();
    }

    // ── 주소 → 후보 자리들 (무료 주소 검색 두 곳을 차례로 — Photon이 한국어에 강해요)
    function geocode(query, ok, fail) {
      fetch('https://photon.komoot.io/api/?limit=4&q=' + encodeURIComponent(query))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.features && j.features.length) {
            ok(j.features.map(function (f) {
              var p = f.properties;
              var label = [p.name, p.city || p.county, p.state, p.country]
                .filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ');
              return { spot: [f.geometry.coordinates[1], f.geometry.coordinates[0]], label: label };
            }));
          } else {
            // 못 찾으면 Nominatim으로 한 번 더
            return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=4&q=' + encodeURIComponent(query))
              .then(function (r) { return r.json(); })
              .then(function (list) {
                if (list && list.length) {
                  ok(list.map(function (item) {
                    return { spot: [parseFloat(item.lat), parseFloat(item.lon)], label: item.display_name };
                  }));
                } else fail();
              });
          }
        })
        .catch(fail);
    }

    function searchAndPlace() {
      var q = document.getElementById('place-input').value.trim();
      if (!q) return;
      var msg = document.getElementById('placing-msg');
      var results = document.getElementById('place-results');
      msg.textContent = '자리를 찾고 있어요…';
      results.innerHTML = '';
      geocode(q, function (options) {
        msg.textContent = options.length > 1 ? '여기인가요?' : '여기인가요? 맞다면 눌러주세요.';
        options.forEach(function (o) {
          var b = document.createElement('button');
          b.className = 'place-option';
          b.textContent = o.label;
          b.addEventListener('click', function () {
            results.innerHTML = '';
            placeAt(o.spot, o.label);
          });
          results.appendChild(b);
        });
      }, function () {
        msg.textContent = '그곳을 찾지 못했어요. 조금 다르게 적어볼까요?';
      });
    }

    document.getElementById('place-search').addEventListener('click', searchAndPlace);
    document.getElementById('place-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); searchAndPlace(); }
    });

    // ── GPS: 브라우저에 위치 권한을 물어봅니다
    function locate(ok, fail) {
      if (!navigator.geolocation) { fail(); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) { ok([pos.coords.latitude, pos.coords.longitude]); },
        function () { fail(); },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // "지금 내가 있는 자리에 두기"
    document.getElementById('place-here').addEventListener('click', function () {
      locate(function (spot) {
        placeAt(spot, '');
      }, function () {
        document.getElementById('placing-msg').textContent =
          '위치를 가져올 수 없었어요. 주소를 적어서 자리를 정해주세요.';
      });
    });

    // "내가 있는 곳으로" — 지도만 내 위치로 이동
    document.getElementById('goto-me').addEventListener('click', function () {
      locate(function (spot) {
        map.setView(spot, 12);
      }, function () {
        alert('위치를 가져올 수 없었어요. 브라우저의 위치 권한을 확인해주세요.');
      });
    });

    drawMarkers();

    // unsent.html에서 "지도에 두기"를 누르고 넘어온 경우 — 바로 자리 정하기를 시작합니다
    var pending = localStorage.getItem('wr_placing_index');
    if (pending !== null) {
      localStorage.removeItem('wr_placing_index');
      var idx = parseInt(pending, 10);
      if (!isNaN(idx) && letters[idx]) {
        startPlacing(idx);
        document.getElementById('placing-note').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  </script>
</body>
</html>
