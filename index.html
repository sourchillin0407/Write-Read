<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dear,</title>
  <!-- Pretendard 폰트 (한국어/영어) -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;        /* 죽인 레몬 */
      --text: #2c2c2c;      /* 소프트 블랙 */
      --point: #6b7c3a;     /* 올리브 그린 (버튼) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;   /* 평소보다 넓은 자간 */
      -webkit-font-smoothing: antialiased;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .greeting {
      font-size: clamp(20px, 4.2vw, 30px);
      font-weight: 500;
      text-align: center;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 13px;
      font-weight: 400;
      text-align: center;
      letter-spacing: 0.04em;
      color: rgba(44, 44, 44, 0.4);
      margin-bottom: 60px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 320px;
    }

    .field {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 16px;
      letter-spacing: inherit;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    /* 가입 모드에서만 보이는 칸(이름) */
    .field.signup-only { display: block; }
    body.login-mode .field.signup-only { display: none; }

    .field::placeholder { color: rgba(44, 44, 44, 0.4); }
    .field:focus { border-bottom-color: var(--text); }

    .enter {
      margin-top: 12px;
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .enter:hover { opacity: 0.85; }
    .enter:disabled { opacity: 0.5; cursor: default; }

    .toggle {
      margin-top: 4px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.5);
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .toggle:hover { color: var(--text); border-bottom-color: var(--text); }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(44, 44, 44, 0.45);
      text-align: center;
      min-height: 1em;
    }

    /* 첫 화면에만 — 가입 후 언어를 바꿀 수 있다는 작은 안내 (한·영) */
    .lang-note {
      margin-top: 28px;
      font-size: 11px;
      color: rgba(44, 44, 44, 0.4);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <p class="greeting">Dear,</p>
  <p class="tagline">A daily question-based pen pal service</p>

  <form id="entry">
    <input class="field signup-only" type="text" name="nickname" placeholder="이름 혹은 별명" autocomplete="off" />
    <input class="field" type="email" name="email" placeholder="이메일 주소" autocomplete="username" />
    <input class="field" type="password" name="password" placeholder="비밀번호" autocomplete="current-password" />
    <button class="enter" type="submit" id="submit-btn"></button>
    <button class="toggle" type="button" id="toggle"></button>
    <p class="note" id="note"></p>
    <p class="lang-note" id="lang-note"></p>
  </form>

  <!-- 먼저 supabase-js, 그 다음 우리 공용 헬퍼(auth.js) 순서로 불러와요 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="i18n.js"></script>
  <script>
    var note = document.getElementById('note');
    var button = document.getElementById('submit-btn');
    var toggle = document.getElementById('toggle');
    var mode = 'signup'; // 'signup' 또는 'login'

    // 이미 로그인된 적이 있으면 — 바로 들여보냅니다 (자동 로그인)
    getAccessToken().then(function (token) {
      if (token) window.location.replace('question.html');
    });

    function setLoginMode(on) {
      mode = on ? 'login' : 'signup';
      document.body.classList.toggle('login-mode', on);
      button.textContent = on ? tBoth('auth.login') : tBoth('auth.signup');
      toggle.textContent = on ? tBoth('auth.toSignup') : tBoth('auth.toLogin');
    }

    // 첫 화면은 한·영을 함께 보여줘요 (방문자의 언어를 아직 모르니까)
    function initBilingual() {
      document.querySelector('input[name="nickname"]').placeholder = tBoth('profile.nickPlaceholder');
      document.querySelector('input[name="email"]').placeholder = tBoth('auth.email');
      document.querySelector('input[name="password"]').placeholder = tBoth('auth.password');
      document.getElementById('lang-note').textContent = tBoth('auth.langNote');
      setLoginMode(false); // 기본은 가입 모드 — 버튼/토글 글자도 한·영으로 채워져요
    }
    initBilingual();

    // 가입 ↔ 로그인 전환
    toggle.addEventListener('click', function () {
      note.textContent = '';
      setLoginMode(mode === 'signup');
    });

    // 이미 가입된 이메일로 가입을 시도한 경우 — 로그인 모드로 안내
    function showAlreadyRegistered(mail) {
      setLoginMode(true);
      document.querySelector('input[name="email"]').value = mail;
      note.textContent = tBoth('auth.already');
    }

    document.getElementById('entry').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var nick = (data.get('nickname') || '').trim();
      var mail = (data.get('email') || '').trim();
      var pw = (data.get('password') || '');

      if (mode === 'signup' && !nick) { note.textContent = tBoth('auth.needNick'); return; }
      if (!mail || !pw) { note.textContent = tBoth('auth.needBoth'); return; }
      if (pw.length < 6) { note.textContent = tBoth('auth.pwShort'); return; }

      button.disabled = true;
      note.textContent = mode === 'signup' ? tBoth('auth.creating') : tBoth('auth.entering');

      if (mode === 'signup') {
        sb.auth.signUp({
          email: mail,
          password: pw,
          options: { data: { nickname: nick, lang: uiLang() } }
        }).then(function (res) {
          button.disabled = false;
          if (res.error) {
            var m = res.error.message || '';
            if (/already registered|already exists|User already/i.test(m)) {
              showAlreadyRegistered(mail);
            } else {
              note.textContent = tBoth('auth.signupFail');
            }
            return;
          }
          // 이메일 확인이 꺼져 있을 때, 이미 가입된 이메일로 다시 가입을 시도하면
          // (이메일 추측 방지를 위해) 에러 없이 세션 없는 응답이 와요 — 이 경우도 "이미 가입됨"으로 안내
          var u = res.data && res.data.user;
          var session = res.data && res.data.session;
          if (!session && u && u.identities && u.identities.length === 0) {
            showAlreadyRegistered(mail);
            return;
          }
          // 세션은 supabase-js가 자동 저장해요. 이름만 화면용으로 기억해둡니다.
          localStorage.setItem('wr_nickname', nick);
          window.location.href = 'question.html';
        }).catch(function () {
          button.disabled = false;
          note.textContent = tBoth('auth.connFail');
        });
      } else {
        sb.auth.signInWithPassword({ email: mail, password: pw }).then(function (res) {
          button.disabled = false;
          if (res.error) {
            note.textContent = tBoth('auth.loginFail');
            return;
          }
          var meta = (res.data && res.data.user && res.data.user.user_metadata) || {};
          localStorage.setItem('wr_nickname', meta.nickname || '');
          window.location.href = 'question.html';
        }).catch(function () {
          button.disabled = false;
          note.textContent = tBoth('auth.connFail');
        });
      }
    });
  </script>
</body>
</html>
