<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read</title>
  <!-- Pretendard 폰트 (한국어/영어) -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;        /* 죽인 레몬 */
      --text: #2c2c2c;      /* 소프트 블랙 */
      --point: #6b7c3a;     /* 올리브 그린 (버튼) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;   /* 평소보다 넓은 자간 */
      -webkit-font-smoothing: antialiased;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .greeting {
      font-size: clamp(20px, 4.2vw, 30px);
      font-weight: 500;
      text-align: center;
      margin-bottom: 64px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 320px;
    }

    .field {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 16px;
      letter-spacing: inherit;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    /* 가입 모드에서만 보이는 칸(이름) */
    .field.signup-only { display: block; }
    body.login-mode .field.signup-only { display: none; }

    .field::placeholder { color: rgba(44, 44, 44, 0.4); }
    .field:focus { border-bottom-color: var(--text); }

    .enter {
      margin-top: 12px;
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .enter:hover { opacity: 0.85; }
    .enter:disabled { opacity: 0.5; cursor: default; }

    .toggle {
      margin-top: 4px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: inherit;
      color: rgba(44, 44, 44, 0.5);
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .toggle:hover { color: var(--text); border-bottom-color: var(--text); }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(44, 44, 44, 0.45);
      text-align: center;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <p class="greeting">Write&amp;Read</p>

  <form id="entry">
    <input class="field signup-only" type="text" name="nickname" placeholder="이름 혹은 별명" autocomplete="off" />
    <input class="field" type="email" name="email" placeholder="이메일 주소" autocomplete="username" />
    <input class="field" type="password" name="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" />
    <button class="enter" type="submit" id="submit-btn">시작하기</button>
    <button class="toggle" type="button" id="toggle">이미 계정이 있어요 — 로그인</button>
    <p class="note" id="note"></p>
  </form>

  <!-- 먼저 supabase-js, 그 다음 우리 공용 헬퍼(auth.js) 순서로 불러와요 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    var note = document.getElementById('note');
    var button = document.getElementById('submit-btn');
    var toggle = document.getElementById('toggle');
    var mode = 'signup'; // 'signup' 또는 'login'

    // 이미 로그인된 적이 있으면 — 바로 들여보냅니다 (자동 로그인)
    getAccessToken().then(function (token) {
      if (token) window.location.replace('question.html');
    });

    // 가입 ↔ 로그인 전환
    toggle.addEventListener('click', function () {
      note.textContent = '';
      if (mode === 'signup') {
        mode = 'login';
        document.body.classList.add('login-mode');
        button.textContent = '들어가기';
        toggle.textContent = '처음이신가요 — 가입하기';
      } else {
        mode = 'signup';
        document.body.classList.remove('login-mode');
        button.textContent = '시작하기';
        toggle.textContent = '이미 계정이 있어요 — 로그인';
      }
    });

    document.getElementById('entry').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var nick = (data.get('nickname') || '').trim();
      var mail = (data.get('email') || '').trim();
      var pw = (data.get('password') || '');

      if (mode === 'signup' && !nick) { note.textContent = '이름 혹은 별명을 적어주세요.'; return; }
      if (!mail || !pw) { note.textContent = '이메일과 비밀번호를 모두 채워주세요.'; return; }
      if (pw.length < 6) { note.textContent = '비밀번호는 6자 이상으로 적어주세요.'; return; }

      button.disabled = true;
      note.textContent = mode === 'signup' ? '계정을 만드는 중…' : '들어가는 중…';

      if (mode === 'signup') {
        sb.auth.signUp({
          email: mail,
          password: pw,
          options: { data: { nickname: nick, lang: 'ko' } }
        }).then(function (res) {
          button.disabled = false;
          if (res.error) {
            var m = res.error.message || '';
            if (/already registered|already exists|User already/i.test(m)) {
              note.textContent = '이미 가입된 이메일이에요. 아래에서 로그인해주세요.';
            } else {
              note.textContent = '가입에 실패했어요. 잠시 후 다시 시도해주세요.';
            }
            return;
          }
          // 세션은 supabase-js가 자동 저장해요. 이름만 화면용으로 기억해둡니다.
          localStorage.setItem('wr_nickname', nick);
          window.location.href = 'question.html';
        }).catch(function () {
          button.disabled = false;
          note.textContent = '연결할 수 없어요. 잠시 후 다시 시도해주세요.';
        });
      } else {
        sb.auth.signInWithPassword({ email: mail, password: pw }).then(function (res) {
          button.disabled = false;
          if (res.error) {
            note.textContent = '이메일 또는 비밀번호를 확인해주세요.';
            return;
          }
          var meta = (res.data && res.data.user && res.data.user.user_metadata) || {};
          localStorage.setItem('wr_nickname', meta.nickname || '');
          window.location.href = 'question.html';
        }).catch(function () {
          button.disabled = false;
          note.textContent = '연결할 수 없어요. 잠시 후 다시 시도해주세요.';
        });
      }
    });
  </script>
</body>
</html>
