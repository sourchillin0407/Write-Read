<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Read</title>
  <!-- Pretendard 폰트 (한국어/영어) -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #eef2c8;        /* 죽인 레몬 */
      --text: #2c2c2c;      /* 소프트 블랙 */
      --point: #6b7c3a;     /* 올리브 그린 (버튼) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Noto Sans', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.04em;   /* 평소보다 넓은 자간 */
      -webkit-font-smoothing: antialiased;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .greeting {
      font-size: clamp(20px, 4.2vw, 30px);
      font-weight: 500;
      text-align: center;
      margin-bottom: 64px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 320px;
    }

    .field {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(44, 44, 44, 0.35);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 16px;
      letter-spacing: inherit;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .field::placeholder { color: rgba(44, 44, 44, 0.4); }
    .field:focus { border-bottom-color: var(--text); }

    .enter {
      margin-top: 12px;
      background: var(--point);
      color: #f4f6e0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .enter:hover { opacity: 0.85; }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(44, 44, 44, 0.45);
      text-align: center;
    }
  </style>
</head>
<body>
  <p class="greeting">Write&amp;Read</p>

  <form id="entry">
    <input class="field" type="text" name="nickname" placeholder="이름 혹은 별명" autocomplete="off" />
    <input class="field" type="email" name="email" placeholder="답장 알림용 이메일 주소" autocomplete="off" />
    <button class="enter" type="submit">시작하기</button>
    <p class="note" id="note"></p>
  </form>

  <script>
    var SUPABASE_URL = 'https://kkjcbazvgrxqzgfbzbcs.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtramNiYXp2Z3J4cXpnZmJ6YmNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzgyNTUsImV4cCI6MjA5Njg1NDI1NX0.C7cvDWeiYM4zCibQz7NK7zKJMZ59NLY7k4JYBfRPJIU';

    // 이미 들어온 적이 있으면 — 다시 묻지 않고 바로 들여보냅니다 (자동 로그인)
    if (localStorage.getItem('wr_nickname') && localStorage.getItem('wr_email')) {
      window.location.replace('question.html');
    }

    // 가입 — 이메일은 데이터베이스에서 중복 여부를 확인합니다.
    document.getElementById('entry').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var nick = (data.get('nickname') || '').trim();
      var mail = (data.get('email') || '').trim();
      var note = document.getElementById('note');
      var button = e.target.querySelector('.enter');
      if (!nick || !mail) {
        note.textContent = '빈칸을 모두 채워주세요.';
        return;
      }

      note.textContent = '확인하는 중…';
      button.disabled = true;

      fetch(SUPABASE_URL + '/rest/v1/users', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ nickname: nick, email: mail, lang: 'ko' })
      }).then(function (res) {
        button.disabled = false;
        if (res.ok) {
          localStorage.setItem('wr_nickname', nick);
          localStorage.setItem('wr_email', mail);
          window.location.href = 'question.html';
        } else if (res.status === 409) {
          note.textContent = '이미 사용 중인 이메일이에요.';
        } else {
          note.textContent = '문제가 생겼어요. 잠시 후 다시 시도해주세요.';
        }
      }).catch(function () {
        button.disabled = false;
        note.textContent = '연결할 수 없어요. 잠시 후 다시 시도해주세요.';
      });
    });
  </script>
</body>
</html>
